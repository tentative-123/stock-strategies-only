name: Discord Webhook Smoke Test

on:
  workflow_dispatch:

jobs:
  send-test-message:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Validate Discord webhook secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: test -n "$DISCORD_WEBHOOK_URL" || (echo "Missing DISCORD_WEBHOOK_URL" && exit 1)

      - name: Send Discord test message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          text = (
              "GitHub Actions Discord webhook smoke test OK\n"
              f"repo: {os.environ['GITHUB_REPOSITORY']}\n"
              f"run: {os.environ['GITHUB_RUN_ID']}"
          )
          payload = json.dumps({"content": text}).encode("utf-8")
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 204):
                  raise SystemExit(f"Discord webhook returned HTTP {response.status}")
              print(f"Discord webhook returned HTTP {response.status}")
          PY
